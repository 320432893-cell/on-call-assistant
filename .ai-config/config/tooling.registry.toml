# Tooling contract registry.
# Human use: read this file to see which tool owns which mechanical check.
# AI/CI use: .ai-config/tools/check_rule_tool_contracts.py verifies these contracts.

[metadata]
version = 1
owner_rule = ".ai-config/AGENTS.md"
human_doc = "docs/TOOLING_CONTRACTS.md"
checker = ".ai-config/tools/check_rule_tool_contracts.py"
unified_entrypoint = "tools/check.py"

[[tools]]
id = "python-compile"
kind = "python-stdlib"
purpose = "Fast syntax/importability-adjacent smoke check by byte-compiling app, scripts, market-impact-study, tests, and tools."
rule = ".ai-config/AGENTS.md"
configured_in = ["tools/check.py"]
pre_commit_hook = "python-compile"
entrypoint_commands = ["uv run python -m compileall -q app scripts market-impact-study tests tools"]
ci_commands = ["uv run python -m compileall -q app scripts market-impact-study tests tools"]
run_mode = "pre-commit+ci"
scope = "app, scripts, market-impact-study, tests, and tools Python files."
boundary = "Only catches syntax and bytecode compilation failures; it does not replace tests, typing, or runtime checks."

[[tools]]
id = "pre-commit-basic-hooks"
kind = "pre-commit-hook-bundle"
purpose = "Repository hygiene checks from pre-commit-hooks: large files, JSON/YAML/TOML syntax, EOF newline, and trailing whitespace."
rule = ".ai-config/AGENTS.md"
configured_in = [".pre-commit-config.yaml"]
pre_commit_hooks = [
    "check-added-large-files",
    "check-json",
    "check-yaml",
    "check-toml",
    "end-of-file-fixer",
    "trailing-whitespace",
]
run_mode = "pre-commit"
scope = "Generic repository hygiene checks maintained by the external pre-commit-hooks package."
boundary = "Mechanical file hygiene only; ownership stays in pre-commit config, not project semantics."

[[tools]]
id = "rule-tool-contracts"
kind = "project-static-tool"
purpose = "Validate AI rules, tool registry, hooks, static rules, CI, and pre-commit wiring contracts."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/tools/check_rule_tool_contracts.py", ".ai-config/config/tooling.registry.toml", "tools/check.py"]
pre_commit_hook = "rule-tool-contracts"
entrypoint_commands = ["uv run python .ai-config/tools/check_rule_tool_contracts.py"]
ci_commands = ["uv run python .ai-config/tools/check_rule_tool_contracts.py"]
run_mode = "pre-commit+ci+manual"
scope = "AI rule files, tool registry, hook manifest/tests, Semgrep rulesets, CI, pre-commit trigger regex, and deleted-rule stale references."
boundary = "Mechanical contract validation only; it does not decide whether a rule or tool policy is desirable."

[[tools]]
id = "coverage-audit"
kind = "project-static-tool"
purpose = "Detect new Python code directories that are not mapped to the unified quality gate."
rule = ".ai-config/AGENTS.md"
configured_in = ["tools/check.py"]
pre_commit_hook = "coverage-audit"
entrypoint_commands = ["python3 tools/check.py coverage-audit"]
run_mode = "pre-commit+manual"
scope = "Top-level Python code directories, excluding caches, virtualenvs, generated data, and support files."
boundary = "Reports missing tool coverage; it does not decide whether a new directory should become production code or support code."

[[tools]]
id = "changed"
kind = "project-static-tool"
purpose = "Automatically run fixed static checks and registered path triggers for changed, staged, and untracked code files."
rule = ".ai-config/AGENTS.md"
configured_in = ["tools/check.py"]
entrypoint_commands = ["python3 tools/check.py changed"]
manual_commands = ["python3 tools/check.py changed"]
run_mode = "manual"
scope = "Changed, staged, and untracked code files; path triggers decide special checks."
boundary = "Uses local git state and may run broader fixed checks such as Semgrep/import-linter. Rule/tooling/hook changes force contract or hook regression checks; expensive or data-dependent checks stay path-triggered."

[[tools]]
id = "ruff"
kind = "python-dev-tool"
package = "ruff"
purpose = "Python lint, formatting, import sorting, common bug patterns, complexity checks."
rule = ".ai-config/AGENTS.md"
configured_in = [".ruff.toml"]
pre_commit_hooks = ["ruff-check", "ruff-format", "ruff-staged"]
entrypoint_commands = ["uv run ruff check .", "uv run ruff format --check .", "uv run ruff check --no-fix --force-exclude"]
manual_commands = ["uv run ruff check .", "uv run ruff format --check ."]
run_mode = "changed-file-pre-commit+manual"
scope = "Staged Python files are checked without autofix before commit. Full check and format remain manual until the historical backlog is green."
boundary = "Does not decide architecture, ownership, business semantics, or user intent."
relaxed = true
relaxed_reason = "全量 ruff check/format 在历史代码上仍有 backlog；先用 ruff-staged 只卡新增改动，避免全量门禁淹没提交。"
reopen_when = "历史 ruff backlog 清零后，把全量 `uv run ruff check .` / `ruff format --check .` 从 manual 升为 pre-commit+ci 阻塞。"

[[tools]]
id = "basedpyright"
kind = "python-dev-tool"
package = "basedpyright"
purpose = "Type, signature, optionality, and static Python type consistency checks."
rule = ".ai-config/AGENTS.md"
configured_in = ["pyproject.toml"]
pre_commit_hook = "basedpyright"
entrypoint_commands = ["uv run basedpyright"]
manual_commands = ["uv run basedpyright"]
run_mode = "manual-pre-commit"
scope = "app/ only. Current type baseline is not yet green; keep basedpyright available but non-blocking until the app typing backlog is fixed."
boundary = "Does not replace tests, runtime behavior checks, or script/test typing outside the configured scope."
relaxed = true
relaxed_reason = "项目中期开 blocking 会因历史 typing backlog 每次提交喷大量警示、淹没新问题；阶段策略为先跑通再精致维护。"
reopen_when = "app/ 的 basedpyright 类型 backlog 烧绿（无残留 error）后，run_mode 转 pre-commit blocking。"

[[tools]]
id = "market-impact-basedpyright"
kind = "python-dev-tool"
package = "basedpyright"
purpose = "Type, signature, optionality, and pandas-script type regression checks for selected market-impact study scripts."
rule = ".ai-config/AGENTS.md"
configured_in = ["tools/check.py", "market-impact-study/.basedpyright-baseline.json"]
entrypoint_commands = ["uv run basedpyright market-impact-study/build_management_signal_tables.py --baselinefile market-impact-study/.basedpyright-baseline.json"]
manual_commands = ["uv run basedpyright market-impact-study/build_management_signal_tables.py --baselinefile market-impact-study/.basedpyright-baseline.json"]
run_mode = "changed-file+manual"
scope = "Currently covers market-impact-study/build_management_signal_tables.py with a baseline for existing pandas typing backlog."
boundary = "Blocks newly introduced typing regressions for covered scripts; the baseline must be reduced over time and does not prove data semantics."
relaxed = true
relaxed_reason = "pandas 脚本存在历史 typing backlog，用 baseline 文件冻结存量、只卡新增回归；非全量 blocking。"
reopen_when = "baseline 逐步缩减到 0 后移除 --baselinefile，使该脚本类型检查转为全量阻塞。"

[[tools]]
id = "import-linter"
kind = "python-dev-tool"
package = "import-linter"
purpose = "Layered import architecture contracts."
rule = ".ai-config/AGENTS.md"
configured_in = [".importlinter"]
pre_commit_hook = "import-linter"
entrypoint_commands = ["uv run lint-imports --config .importlinter --no-cache"]
ci_commands = ["uv run lint-imports --config .importlinter --no-cache"]
run_mode = "pre-commit+ci"
boundary = "Checks import direction only; does not prove runtime architecture quality."

[[tools]]
id = "detect-secrets"
kind = "python-dev-tool"
package = "detect-secrets"
purpose = "Secret leakage scan and baseline audit."
rule = ".ai-config/AGENTS.md"
configured_in = [".secrets.baseline", ".pre-commit-config.yaml"]
pre_commit_hook = "detect-secrets"
entrypoint_commands = ["uv run detect-secrets scan --baseline .secrets.baseline --exclude-files '^(uv\\\\.lock|\\\\.secrets\\\\.baseline|\\\\.ai-config/config/settings\\\\.json\\\\.template)$'", "uv run detect-secrets audit .secrets.baseline --report"]
ci_commands = ["uv run detect-secrets scan --baseline .secrets.baseline --exclude-files '^(uv\\\\.lock|\\\\.secrets\\\\.baseline|\\\\.ai-config/config/settings\\\\.json\\\\.template)$'", "uv run detect-secrets audit .secrets.baseline --report"]
run_mode = "pre-commit+ci"
boundary = "Does not decide whether a found value is safe to publish; human review is still required."

[[tools]]
id = "semgrep"
kind = "python-dev-tool"
package = "semgrep"
purpose = "Project static guardrails that are too specific for Ruff."
rule = ".ai-config/AGENTS.md"
configured_in = [".semgrep"]
pre_commit_hook = "semgrep"
entrypoint_commands = ["uv run semgrep --disable-version-check --metrics=off --config .semgrep --no-git-ignore app scripts market-impact-study tests tools .ai-config .ai-hooks"]
ci_commands = ["uv run semgrep --disable-version-check --metrics=off --config .semgrep --no-git-ignore app scripts market-impact-study tests tools .ai-config .ai-hooks"]
run_mode = "pre-commit+ci"
scope = "app, scripts, market-impact-study, tests, tools, .ai-config, and .ai-hooks."
boundary = "Use for stable static patterns only; do not encode broad business semantics."

[[tools]]
id = "dependency-change-approval"
kind = "project-static-tool"
purpose = "Block staged dependency or lock-file changes until the user has explicitly approved the dependency/toolchain impact."
rule = ".ai-config/AGENTS.md"
configured_in = [".pre-commit-config.yaml", "tools/check.py"]
pre_commit_hook = "dependency-change-approval"
entrypoint_commands = ["python3 tools/check.py dependency-change-approval"]
run_mode = "pre-commit"
scope = "Only pyproject.toml and uv.lock staged changes. Override after discussion with ONCALL_ALLOW_DEPENDENCY_CHANGE=1."
boundary = "Checks that approval was made explicit; it cannot judge whether the dependency decision is good."

[[tools]]
id = "pip-audit"
kind = "python-dev-tool"
package = "pip-audit"
purpose = "Dependency vulnerability audit."
rule = ".ai-config/AGENTS.md"
configured_in = ["pyproject.toml", "uv.lock"]
pre_commit_hook = "pip-audit"
entrypoint_commands = ["uv run pip-audit --strict"]
ci_commands = ["uv run pip-audit --strict"]
run_mode = "manual-pre-commit+ci"
boundary = "Vulnerability triage still needs human decision for ignore, upgrade, or mitigation."

[[tools]]
id = "pytest"
kind = "python-dev-tool"
package = "pytest"
purpose = "Unit and integration tests."
rule = ".ai-config/AGENTS.md"
configured_in = ["pyproject.toml"]
entrypoint_commands = ["uv run pytest tests"]
ci_commands = ["uv run pytest tests"]
run_mode = "ci"
scope = "Stable automated tests under tests/. Script-style validation under scripts/ remains manual or changed-file scoped until it is refactored into stable tests."
boundary = "CI runs the stable tests/ suite only; service-dependent or data-preparation scripts must not be implied by the default pytest contract."

[[tools]]
id = "rag-drift"
kind = "project-static-tool"
purpose = "Detect RAG data-contract drift for embedding model, chunking, and vector schema changes."
rule = ".ai-config/rules/engineering/code.index.md"
configured_in = ["scripts/check_rag_drift.py", "tools/check.py"]
entrypoint_commands = ["uv run python scripts/check_rag_drift.py"]
manual_commands = ["uv run python scripts/check_rag_drift.py"]
ci_commands = ["uv run python scripts/check_rag_drift.py"]
run_mode = "ci+manual+path-trigger"
scope = "RAG-adjacent code and settings; changed-file trigger is registered in path_triggers."
boundary = "Warns about index/schema drift risk; it does not reindex data or decide whether a semantic migration is required."

[[tools]]
id = "market-impact-validation"
kind = "project-static-tool"
purpose = "Rebuild-independent data quality and CAR spot checks for the market-impact study outputs."
rule = ".ai-config/rules/process/modes.index.md"
configured_in = ["market-impact-study/validate_market_outputs.py", "tools/check.py"]
entrypoint_commands = ["uv run python market-impact-study/validate_market_outputs.py"]
manual_commands = ["uv run python market-impact-study/validate_market_outputs.py"]
run_mode = "manual"
scope = "Requires collected market-impact-study/data files, so it is not part of CI by default."
boundary = "Validates generated data consistency and CAR spot calculations; it does not prove event causality or CFO narrative correctness."

[[path_triggers]]
id = "market-impact-study-data-validation"
tool = "market-impact-validation"
paths = ["market-impact-study/**"]
run_mode = "changed-data-present"
required_paths = [
    "market-impact-study/data/raw/tushare/daily",
    "market-impact-study/data/processed/event_candidates.csv",
    "market-impact-study/data/processed/event_analysis_groups_scored.csv",
]
purpose = "Run market-impact data consistency checks when study code changes and local collected data exists."

[[path_triggers]]
id = "rag-data-contract-drift"
tool = "rag-drift"
paths = [
    "app/config/**",
    "app/routers/**",
    "app/services/**",
    "pyproject.toml",
    "scripts/**",
]
run_mode = "changed"
purpose = "Run RAG embedding/chunk/vector-schema drift detection when RAG-adjacent code or settings change."

[[tools]]
id = "dirty-diff-review"
kind = "project-static-tool"
purpose = "Dirty diff additions smell scanner for 80/20 AI-human engineering approach discussion."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/tools/dirty_diff_review.py"]
entrypoint_commands = ["python3 .ai-config/tools/dirty_diff_review.py"]
manual_commands = ["python3 .ai-config/tools/dirty_diff_review.py"]
run_mode = "post-edit-hook+manual"
scope = "Reads current git diff additions and reports high-ROI smells without modifying files."
boundary = "Heuristic discussion trigger only; not a blocker and not a refactoring decision engine."

[[tools]]
id = "delivery-evidence"
kind = "project-static-tool"
purpose = "Validate AI delivery evidence packs against the current git diff to catch stale reports, missing evidence, trigger omissions, and uncovered changed files."
rule = ".ai-config/AGENTS.md"
configured_in = [".ai-config/tools/check_delivery_evidence.py", ".ai-config/evidence/templates", "tools/check.py"]
entrypoint_commands = ["python3 .ai-config/tools/check_delivery_evidence.py"]
manual_commands = ["python3 .ai-config/tools/check_delivery_evidence.py"]
run_mode = "manual-completion-gate"
scope = "Evidence pack under .ai-evidence/current plus current tracked, staged, and untracked git diff excluding .ai-evidence itself."
boundary = "Mechanical evidence-chain validation only; it does not decide business semantics, design quality, or whether a rationale is correct."

[[tools]]
id = "radon"
kind = "python-dev-tool"
package = "radon"
purpose = "Complexity and maintainability smell scan for dirty-code triage."
rule = ".ai-config/rules/engineering/code.index.md"
configured_in = ["pyproject.toml"]
entrypoint_commands = ["uv run radon cc app scripts market-impact-study -s -n C", "uv run radon mi app scripts market-impact-study -s"]
manual_commands = ["uv run radon cc app scripts market-impact-study -s -n C", "uv run radon mi app scripts market-impact-study -s"]
run_mode = "manual"
scope = "Use for 80/20 complexity triage in app, scripts, and market-impact-study before choosing local patch vs decomposition/refactor."
boundary = "Complexity score suggests discussion; it does not mandate a refactor."

[[tools]]
id = "vulture"
kind = "python-dev-tool"
package = "vulture"
purpose = "Likely dead code and unused symbol scan."
rule = ".ai-config/rules/engineering/code.index.md"
configured_in = ["pyproject.toml"]
entrypoint_commands = ["uv run vulture app scripts market-impact-study --min-confidence 80"]
manual_commands = ["uv run vulture app scripts market-impact-study --min-confidence 80"]
run_mode = "manual"
scope = "Use for cleanup discussion in app, scripts, and market-impact-study; old projects may have dynamic entry points and compatibility hooks."
boundary = "Never delete solely from Vulture output without checking runtime entry points and tests."

[[tools]]
id = "deptry"
kind = "python-dev-tool"
package = "deptry"
purpose = "Dependency hygiene: unused, missing, and transitive dependency drift."
rule = ".ai-config/rules/engineering/code.index.md"
configured_in = ["pyproject.toml"]
entrypoint_commands = ["uv run deptry ."]
manual_commands = ["uv run deptry ."]
run_mode = "manual"
scope = "Use for dependency debt triage."
boundary = "Dynamic imports, optional providers, and script-only dependencies need human review."

[[tools]]
id = "module-boundary"
kind = "project-static-tool"
purpose = "检查 app/ 和 scripts/ 下的 Python 文件是否有职责声明注释块（# 职责 / # 不负责 / # 依赖层）。"
rule = ".ai-config/AGENTS.md"
configured_in = ["tools/check_module_boundary.py", "tools/check.py"]
entrypoint_commands = ["python3 tools/check_module_boundary.py"]
manual_commands = ["python3 tools/check_module_boundary.py"]
run_mode = "manual"
scope = "app/ and scripts/ Python files, excluding __init__.py, conftest.py, and test files."
boundary = "检测注释是否存在；不校验注释内容是否准确，内容质量由 AI 规则（谋划态契约槽⑥）约束。"
relaxed = true
relaxed_reason = "存量 22 个文件尚无职责注释，先保持 manual 不阻塞；新文件由 AGENTS.md 规则在谋划态强制。"
reopen_when = "存量文件职责注释补全后升为 pre-commit WARNING blocking。"

[[semgrep_rulesets]]
path = ".semgrep/backend-contracts.yml"
owner_rule = ".ai-config/AGENTS.md"
purpose = "Backend API auth markers, transaction IO, sensitive response details, and traceback-preserving logs."

[[semgrep_rulesets]]
path = ".semgrep/fastapi-debug.yml"
owner_rule = ".ai-config/AGENTS.md"
purpose = "FastAPI/Starlette debug, reload, and unsafe CORS static guardrails."

[[semgrep_rulesets]]
path = ".semgrep/http-timeout.yml"
owner_rule = ".ai-config/rules/engineering/code.index.md"
purpose = "HTTP client calls must set explicit timeout."

[[semgrep_rulesets]]
path = ".semgrep/html-template-safety.yml"
owner_rule = ".ai-config/AGENTS.md"
purpose = "HTML template injection guardrails for unsafe innerHTML/template interpolation."

[[semgrep_rulesets]]
path = ".semgrep/python-bad-smells.yml"
owner_rule = ".ai-config/rules/engineering/code.index.md"
purpose = "High-ROI Python bad-smell guardrails that Ruff cannot express well."

[[semgrep_rulesets]]
path = ".semgrep/ml-timeseries.yml"
owner_rule = ".ai-config/rules/process/modes.index.md"
purpose = "Time-series and reproducible split guardrails."

[[semgrep_rulesets]]
path = ".semgrep/playwright-no-sleep.yml"
owner_rule = ".ai-config/AGENTS.md"
purpose = "Playwright files should not use raw time.sleep."

[[semgrep_rulesets]]
path = ".semgrep/playwright-robustness.yml"
owner_rule = ".ai-config/AGENTS.md"
purpose = "Playwright download, dialog, and long wait robustness guardrails."

[[semgrep_rulesets]]
path = ".semgrep/rag-hygiene.yml"
owner_rule = ".ai-config/rules/engineering/code.index.md"
purpose = "RAG retrieval and embedding static guardrails."

[[hooks]]
file = ".ai-hooks/dangerous_bash.sh"
event = "PreToolUse_Bash"
rule_route = ".ai-config/AGENTS.md"
purpose = "Immediate guardrail for dangerous shell commands."

[[hooks]]
file = ".ai-hooks/git_commit_safety.sh"
event = "PreToolUse_Bash"
rule_route = ".ai-config/AGENTS.md"
purpose = "Git commit safety reminders."

[[hooks]]
file = ".ai-hooks/dirty_static_review.sh"
event = "PostToolUse_EditWriteMultiEdit"
rule_route = ".ai-config/AGENTS.md"
purpose = "Read dirty edited files after writes, report non-mutating static feedback, and prompt the engineering paradigm discussion."

[[hooks]]
file = ".ai-hooks/rename_audit.sh"
event = "PostToolUse_EditWriteMultiEdit"
rule_route = ".ai-config/AGENTS.md"
purpose = "Rename/reference drift reminder after edits."

[[hooks]]
file = ".ai-hooks/rag_hygiene.sh"
event = "PostToolUse_EditWriteMultiEdit"
rule_route = ".ai-config/rules/engineering/code.index.md"
purpose = "Immediate BGE embedding semantic reminder not expressible by mature static tools."

[[hooks]]
file = ".ai-hooks/rag_drift.sh"
event = "PostToolUse_EditWriteMultiEdit"
rule_route = ".ai-config/rules/engineering/code.index.md"
purpose = "RAG data-contract drift reminder backed by scripts/check_rag_drift.py."

[[hook_tests]]
file = ".ai-hooks/tests/test_bash_safety_hooks.sh"
ci_command = "bash .ai-hooks/tests/test_bash_safety_hooks.sh"
purpose = "Regression tests for dangerous_bash.sh and git_commit_safety.sh command parsing."
covers = [".ai-hooks/dangerous_bash.sh", ".ai-hooks/git_commit_safety.sh"]

[[hook_tests]]
file = ".ai-hooks/tests/test_dirty_static_review.sh"
ci_command = "bash .ai-hooks/tests/test_dirty_static_review.sh"
purpose = "Regression tests for dirty_static_review.sh dirty-file static scan and paradigm prompt."
covers = [".ai-hooks/dirty_static_review.sh"]

[[hook_tests]]
file = ".ai-hooks/tests/test_reference_drift_hooks.sh"
ci_command = "bash .ai-hooks/tests/test_reference_drift_hooks.sh"
purpose = "Regression tests for rename_audit.sh and rag_drift.sh reference/data-contract drift reminders."
covers = [".ai-hooks/rename_audit.sh", ".ai-hooks/rag_drift.sh"]

[[hook_tests]]
file = ".ai-hooks/tests/test_rag_hygiene.sh"
ci_command = "bash .ai-hooks/tests/test_rag_hygiene.sh"
purpose = "Regression tests for rag_hygiene.sh BGE encode reminder."
covers = [".ai-hooks/rag_hygiene.sh"]
