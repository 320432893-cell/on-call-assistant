rules:
  - id: timeseries-train-test-split
    message: "Time-series files should not use train_test_split without shuffle=False; prefer TimeSeriesSplit or walk-forward validation."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern-either:
          - pattern-inside: |
              ...
              pd.to_datetime(...)
              ...
          - pattern-inside: |
              ...
              pd.DatetimeIndex(...)
              ...
          - pattern-inside: |
              ...
              pd.date_range(...)
              ...
      - pattern: train_test_split(...)
      - pattern-not: train_test_split(..., shuffle=False, ...)

  - id: sklearn-train-test-split-without-random-state
    message: "train_test_split with default shuffling should set random_state= for reproducible analysis."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern: train_test_split(...)
      - pattern-not: train_test_split(..., shuffle=False, ...)
      - pattern-not: train_test_split(..., random_state=..., ...)

  - id: sklearn-kfold-without-random-state
    message: "Shuffling KFold variants should set random_state= for reproducible cross-validation."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern-either:
          - pattern: KFold(..., shuffle=True, ...)
          - pattern: StratifiedKFold(..., shuffle=True, ...)
      - pattern-not: KFold(..., random_state=..., ...)
      - pattern-not: StratifiedKFold(..., random_state=..., ...)

  - id: sklearn-repeated-kfold-without-random-state
    message: "RepeatedKFold variants should set random_state= for reproducible cross-validation."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern-either:
          - pattern: RepeatedKFold(...)
          - pattern: RepeatedStratifiedKFold(...)
      - pattern-not: RepeatedKFold(..., random_state=..., ...)
      - pattern-not: RepeatedStratifiedKFold(..., random_state=..., ...)

  - id: sklearn-shuffle-split-without-random-state
    message: "ShuffleSplit variants should set random_state= for reproducible cross-validation."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern-either:
          - pattern: ShuffleSplit(...)
          - pattern: StratifiedShuffleSplit(...)
          - pattern: GroupShuffleSplit(...)
      - pattern-not: ShuffleSplit(..., random_state=..., ...)
      - pattern-not: StratifiedShuffleSplit(..., random_state=..., ...)
      - pattern-not: GroupShuffleSplit(..., random_state=..., ...)

  - id: timeseries-negative-shift-with-modeling-call
    message: "Negative shift appears in a modeling file; verify it only creates target y, not leaked future features."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern-either:
          - pattern-inside: |
              ...
              $MODEL.fit(...)
              ...
          - pattern-inside: |
              ...
              $MODEL.predict(...)
              ...
          - pattern-inside: |
              ...
              cross_val_score(...)
              ...
          - pattern-inside: |
              ...
              cross_validate(...)
              ...
      - pattern-either:
          - pattern: $SERIES.shift(-$N)
          - pattern: $SERIES.shift(periods=-$N)

  - id: sklearn-random-forest-without-random-state
    message: "RandomForest models should set random_state= for reproducible training and analysis."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern-either:
          - pattern: RandomForestClassifier(...)
          - pattern: RandomForestRegressor(...)
      - pattern-not: RandomForestClassifier(..., random_state=..., ...)
      - pattern-not: RandomForestRegressor(..., random_state=..., ...)

  - id: sklearn-gradient-boosting-without-random-state
    message: "GradientBoosting models should set random_state= for reproducible training and analysis."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern-either:
          - pattern: GradientBoostingClassifier(...)
          - pattern: GradientBoostingRegressor(...)
      - pattern-not: GradientBoostingClassifier(..., random_state=..., ...)
      - pattern-not: GradientBoostingRegressor(..., random_state=..., ...)

  - id: xgboost-without-seed
    message: "XGBoost models should set random_state= or seed= for reproducible training and analysis."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern-either:
          - pattern: XGBClassifier(...)
          - pattern: XGBRegressor(...)
          - pattern: XGBRanker(...)
      - pattern-not: XGBClassifier(..., random_state=..., ...)
      - pattern-not: XGBClassifier(..., seed=..., ...)
      - pattern-not: XGBRegressor(..., random_state=..., ...)
      - pattern-not: XGBRegressor(..., seed=..., ...)
      - pattern-not: XGBRanker(..., random_state=..., ...)
      - pattern-not: XGBRanker(..., seed=..., ...)

  - id: lightgbm-without-seed
    message: "LightGBM models should set random_state= or seed= for reproducible training and analysis."
    severity: WARNING
    languages: [python]
    paths:
      exclude:
        - "**/tests/**"
        - "**/test/**"
        - "**/test_*.py"
        - "**/*_test.py"
    patterns:
      - pattern-either:
          - pattern: LGBMClassifier(...)
          - pattern: LGBMRegressor(...)
      - pattern-not: LGBMClassifier(..., random_state=..., ...)
      - pattern-not: LGBMClassifier(..., seed=..., ...)
      - pattern-not: LGBMRegressor(..., random_state=..., ...)
      - pattern-not: LGBMRegressor(..., seed=..., ...)
