rules:
  - id: playwright-click-download-without-expect-download
    message: "When a Playwright click triggers a download, wrap the trigger in page.expect_download() instead of guessing a path or reading the file later."
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-regex: (?s)(from\s+playwright(?:\.[\w_]+)?\s+import|import\s+playwright(?:\.[\w_]+)?).*?\.click\([^)]*(download|export|save|pdf|xlsx|csv)[^)]*\)
      - pattern-not-regex: (?s)expect_download\(

  - id: playwright-dialog-handler-after-trigger
    message: "Register Playwright dialog handlers before the action that can open the dialog."
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-regex: (?s)(from\s+playwright(?:\.[\w_]+)?\s+import|import\s+playwright(?:\.[\w_]+)?).*?\.click\(.*?\.on\(\s*['\"]dialog['\"]

  - id: playwright-long-wait-for-timeout
    message: "Long page.wait_for_timeout() calls are usually brittle; prefer waiting for a selector, response, download, or explicit state."
    severity: WARNING
    languages: [python]
    patterns:
      - pattern-regex: (?s)(from\s+playwright(?:\.[\w_]+)?\s+import|import\s+playwright(?:\.[\w_]+)?).*?\.wait_for_timeout\(\s*([3-9]\d{3,}|[1-9]\d{4,})
