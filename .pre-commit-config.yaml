# 阶段 1 最小集：import-linter / detect-secrets / semgrep / 工具契约 / pip-audit(manual)
# 设计原则：
#   - detect-secrets 与项目依赖无关 → 用 pre-commit 隔离 env (repo: 模式)
#   - import-linter 必须能 import 到 app/* 与 fastapi/pydantic 类型 → 用 language: system 跑项目 .venv 里的工具
#   - semgrep / pip-audit 跑项目 .venv 里的固定 dev 依赖，避免 uvx 临时解析/缓存
#   - detect-secrets 版本钉死(rev); import-linter/semgrep/pip-audit 走项目 venv
#   - pip-audit 需要解析依赖漏洞库，默认放 manual 阶段；CI 中固定执行
#   - ruff / basedpyright 当前是历史代码质量基线工具，先 manual，避免把已知红灯伪装成阻塞检查

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
        stages: [manual]
      - id: ruff-format
        stages: [manual]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            uv\.lock|
            \.secrets\.baseline|
            \.ai-config/settings\.json\.template
          )$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: python-compile
        name: python compile smoke check
        entry: python3 tools/check.py python-compile
        language: system
        pass_filenames: false
        types: [python]

      - id: basedpyright
        name: basedpyright (project venv)
        entry: .venv/bin/basedpyright
        language: system
        stages: [manual]
        types: [python]
        # 仅检查 app/，scripts/ 与 tests/ 后续阶段再纳入
        files: ^app/
        pass_filenames: false

      - id: import-linter
        name: import-linter (分层契约)
        entry: python3 tools/check.py import-linter
        language: system
        pass_filenames: false
        # 任何 .py 改动都跑一遍(架构契约级,不该被跳)
        types: [python]

      - id: rule-tool-contracts
        name: rule/tool contract check
        entry: python3 tools/check.py rule-tool-contracts
        language: system
        pass_filenames: false
        files: ^(\.ai-config/|\.ai-hooks/|\.semgrep/|\.github/workflows/ci\.yml|\.pre-commit-config\.yaml|tools/check\.py|pyproject\.toml|uv\.lock)$

      - id: semgrep
        name: semgrep (project static guardrails)
        entry: python3 tools/check.py semgrep
        language: system
        pass_filenames: false
        files: ^(.+\.py|app/templates/.+\.html|\.semgrep/.+\.ya?ml)$

      - id: pip-audit
        name: pip-audit (dependency vulnerabilities)
        entry: python3 tools/check.py pip-audit
        language: system
        pass_filenames: false
        stages: [manual]
