<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Phase2: 语义搜索</title>
    <style>
        body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #333; }
        .search-box { margin: 20px 0; }
        input[type="text"] { width: 70%; padding: 10px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        .result { border: 1px solid #eee; padding: 15px; margin: 10px 0; border-radius: 4px; }
        .result h3 { margin: 0 0 10px 0; color: #0066cc; }
        .result .score { color: #666; font-size: 14px; }
        .result .snippet { color: #333; margin-top: 8px; }
        .error { color: red; padding: 10px; }
        .hint { color: #888; font-size: 13px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Phase2: 语义搜索</h1>
    <div class="hint">提示：可输入自然语言描述（如"服务器挂了"），系统会返回语义相关的 SOP。</div>
    <div class="search-box">
        <input type="text" id="query" placeholder="输入问题，如：服务器挂了 / 黑客攻击 / 推荐质量下降" />
        <button onclick="search()">搜索</button>
    </div>
    <div id="results"></div>

    <script>
        document.getElementById('query').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') search();
        });

        function clearResults(container) {
            while (container.firstChild) container.removeChild(container.firstChild);
        }

        function setText(container, tagName, text, className = '') {
            const el = document.createElement(tagName);
            if (className) el.className = className;
            el.textContent = text;
            container.appendChild(el);
            return el;
        }

        function renderResults(container, results) {
            clearResults(container);
            for (const r of results) {
                const item = document.createElement('div');
                item.className = 'result';
                setText(item, 'h3', `${r.id}: ${r.title}`);
                setText(item, 'div', `相似度: ${Number(r.score).toFixed(4)}`, 'score');
                setText(item, 'div', r.snippet || '', 'snippet');
                container.appendChild(item);
            }
        }

        async function search() {
            const q = document.getElementById('query').value.trim();
            if (!q) return;

            const resultsDiv = document.getElementById('results');
            clearResults(resultsDiv);
            setText(resultsDiv, 'p', '搜索中（首次需加载 bge-m3 模型，约 30 秒）...');

            try {
                const resp = await fetch(`/v2/search?q=${encodeURIComponent(q)}`);
                const data = await resp.json();

                if (!data.results || data.results.length === 0) {
                    clearResults(resultsDiv);
                    setText(resultsDiv, 'p', '未找到相关文档');
                    return;
                }

                renderResults(resultsDiv, data.results);

            } catch (err) {
                clearResults(resultsDiv);
                setText(resultsDiv, 'div', `搜索失败: ${err.message}`, 'error');
            }
        }
    </script>
</body>
</html>
