name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-type-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Basedpyright
        run: uv run basedpyright

      - name: Import linter
        run: uv run lint-imports --config .importlinter --no-cache

      - name: Semgrep
        run: uv run semgrep --config .semgrep

      - name: RAG drift check
        run: uv run python scripts/check_rag_drift.py

      - name: Detect secrets
        run: |
          uv run detect-secrets scan --exclude-files 'uv\.lock' \
            --list-all-plugins 2>/dev/null
          uv run detect-secrets audit .secrets.baseline --report

      - name: Tests + Coverage
        run: |
          uv run pytest tests/ --cov=app --cov-report=term-missing --cov-fail-under=80
        if: hashFiles('tests/') != ''
